server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # The project root is also the web root, so keep everything that is not a
    # page out of reach: .env (credentials), .git, config, source code,
    # dependencies, templates and logs. These rules must stay above the PHP block.
    location ~ /\. {
        return 404;
    }

    location ~ ^/(config|src|templates|vendor|logs)/ {
        return 404;
    }

    location ~ ^/(composer\.(json|lock)|Dockerfile|docker-compose\.yml|nginx\.conf)$ {
        return 404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}